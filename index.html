const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let selected=0,filter='All',photoToken=0;const photoCache=new Map();
function fitHeading(){const h=document.querySelector('h1'),header=h.parentElement,style=getComputedStyle(header),w=header.clientWidth-parseFloat(style.paddingLeft)-parseFloat(style.paddingRight);h.style.fontSize='88px';let size=88;while(h.scrollWidth>w&&size>8){size-=.5;h.style.fontSize=size+'px'}h.style.transform='scaleY(1.7)';header.style.paddingTop=Math.max(20,size*.55)+'px';header.style.paddingBottom=Math.max(20,size*.55)+'px'}
function matches(){const q=$('search').value.trim().toLowerCase();return trips.map((t,i)=>({t,i})).filter(({t})=>(filter==='All'||t.category===filter)&&(!q||JSON.stringify([t.name,t.foods,t.sights]).toLowerCase().includes(q)))}
function renderList(){const v=matches();$('count').textContent=v.length+' places';$('list').innerHTML=v.map(({t,i})=>`<button class="trip ${i===selected?'active':''}" data-trip="${i}" aria-pressed="${i===selected}"><strong>${esc(t.name)}</strong><small>${esc(t.drive)} · ${esc(t.nights)}</small></button>`).join('');document.querySelectorAll('[data-trip]').forEach(b=>b.onclick=()=>selectTrip(Number(b.dataset.trip)))}
function setMap(t){const span=.065,bbox=[t.lng-span,t.lat-span*.65,t.lng+span,t.lat+span*.65].join(',');$('map').src='https://www.openstreetmap.org/export/embed.html?bbox='+encodeURIComponent(bbox)+'&layer=mapnik&marker='+encodeURIComponent(t.lat+','+t.lng);$('maplink').href='https://www.openstreetmap.org/?mlat='+t.lat+'&mlon='+t.lng+'#map=12/'+t.lat+'/'+t.lng}
async function locationPhoto(t){const token=++photoToken,img=$('photo'),fallback=$('fallback'),credit=$('credit');img.hidden=true;fallback.hidden=false;fallback.textContent='Loading location photo...';const article='https://en.wikipedia.org/wiki/'+encodeURIComponent(t.wiki.replaceAll(' ','_'));credit.textContent=t.name+' · photo source';credit.href=article;
 try{let data=photoCache.get(t.wiki);if(!data){const u='https://en.wikipedia.org/w/api.php?origin=*&action=query&format=json&prop=pageimages|info&inprop=url&piprop=thumbnail&pithumbsize=1200&redirects=1&titles='+encodeURIComponent(t.wiki);const r=await fetch(u,{signal:AbortSignal.timeout(10000)});if(!r.ok)throw Error();const result=await r.json();data=Object.values(result.query.pages).find(p=>p.thumbnail?.source);if(!data)throw Error();photoCache.set(t.wiki,data)}if(token!==photoToken)return;img.onload=()=>{if(token===photoToken){img.hidden=false;fallback.hidden=true}};img.onerror=()=>photoFallback(article,token);img.alt=t.name+' (area photograph)';img.src=data.thumbnail.source;credit.href=data.fullurl||article;credit.textContent=t.name+' · image source and credits';}catch(e){photoFallback(article,token)}}
function photoFallback(url,token){if(token!==photoToken)return;$('photo').hidden=true;$('fallback').hidden=false;$('fallback').innerHTML=`<span>Photo unavailable here.<br><a target="_blank" rel="noopener" href="${esc(url)}">View location photos</a></span>`}
function selectTrip(i){selected=i;const t=trips[i];setMap(t);locationPhoto(t);$('detail').innerHTML=`<h2>${esc(t.name)}</h2><p class="intro">${esc(t.intro)}</p><div class="stats"><div class="stat"><small>Drive from Auckland</small>${esc(t.drive)}</div><div class="stat"><small>Suggested stay</small>${esc(t.nights)}</div></div><div class="columns"><div class="panel"><h3>Things to do</h3><ul>${t.sights.map(s=>`<li>${esc(s)}</li>`).join('')}</ul><h3>Stay</h3><p>${esc(t.stay)}</p><a href="${esc(t.url)}" target="_blank" rel="noopener">Official details</a><h3 style="margin-top:18px">Before you go</h3><p>${esc(t.watch)}</p></div><div class="panel"><h3>Food & vibe</h3><p>${esc(t.foodnote)}</p>${t.foods.map(f=>`<div class="food"><a href="${esc(f[2])}" target="_blank" rel="noopener"><strong>${esc(f[0])}</strong></a><p>${esc(f[1])}</p>${f[3]?`<small>${esc(f[3])}</small>`:''}</div>`).join('')}</div></div><div class="actions"><a href="${esc($('maplink').href)}" target="_blank" rel="noopener">Destination map</a><button id="print">Print trip</button></div><p class="note">Check current access, opening hours and weather. Map and area photographs need internet access. Photo credits are linked above.</p>`;$('print').onclick=()=>window.print();renderList();try{history.replaceState(null,'','#trip-'+i)}catch(e){}}
function changed(){const v=matches();if(v.length)selectTrip(v.some(x=>x.i===selected)?selected:v[0].i);else{renderList();$('detail').innerHTML='<div class="empty">No matches. Try another search or reset.</div>'}}
$('search').oninput=changed;document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));changed()});$('reset').onclick=()=>{$('search').value='';filter='All';document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x.dataset.filter==='All'));changed()};window.addEventListener('resize',fitHeading);document.fonts.ready.then(fitHeading);fitHeading();const hash=location.hash.match(/^#trip-([0-7])$/);selectTrip(hash?Number(hash[1]):0);
