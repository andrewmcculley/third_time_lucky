<!doctype html>
<html lang="en-NZ">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PLACES NEAR AUCKLAND THAT ARE NOT HAMILTON.</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#faf9f5;color:#17324d;font:15px/1.55 system-ui,sans-serif}header{background:#12354a;color:white;padding:24px;overflow:hidden}h1{font-family:Impact,"Arial Black",sans-serif;white-space:nowrap;line-height:1.12;margin:0;width:max-content;transform-origin:left center;font-size:88px;letter-spacing:-.025em}.layout{display:grid;grid-template-columns:290px minmax(0,1fr);aside{padding:20px;border-right:1px solid #dbe2df}input{width:100%;padding:11px;border:1px solid #c7d7d4;border-radius:8px;background:white;font:inherit}.filters{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}.filter,.reset{border:1px solid #c7d7d4;background:white;border-radius:18px;padding:5px 10px;color:#17324d;font:inherit}.filter.active{background:#167d7b;color:white}.reset{font-size:12px}#count{font-size:12px;color:#5b707b}.trip{display:block;width:100%;text-align:left;background:white;border:1px solid #dbe2df;border-radius:12px;padding:14px;margin:10px 0;color:#17324d}.trip.active{border:2px solid #167d7b;background:#edf5f1}.trip strong{display:block;font-size:16px}.trip small{color:#5b707b}.media{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);height:420px}.mapWrap,.photo{position:relative;min-width:0;height:420px;background:#e4ece8;overflow:hidden}.mapWrap{border-right:2px solid white}iframe{width:100%;height:100%;border:0;display:block}.photo{margin:0}.photo img{width:100%;height:100%;object-fit:cover;display:block}.photo img[hidden]{display:none}.photo figcaption{position:absolute;bottom:0;left:0;right:0;background:#12354adb;padding:8px 12px;color:white;font-size:11px}.fallback{position:absolute;inset:0;display:grid;place-content:center;text-align:center;padding:20px}.fallback[hidden]{display:none}.fallback a{color:white}.maplink{position:absolute;bottom:12px;left:12px;padding:7px 10px;background:white;border-radius:7px;color:#17324d;font-size:11px}.detail{padding:25px;max-width:1200px}.detail h2{font-size:30px;line-height:1.2;margin:0 0 10px}.intro{color:#5b707b;margin-top:0}.stats{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.stat{padding:9px 14px;background:#edf3ef;border-radius:8px}.stat small{display:block;color:#5b707b}.columns{display:grid;grid-template-columns:1fr 1fr;gap:18px}.panel{border:1px solid #dbe2df;border-radius:12px;padding:18px;background:white}h3{margin:0 0 8px}.panel p{margin:8px 0;font-size:14px}.food{padding:9px 0;border-top:1px solid #e0e7e3}.food p{margin:3px 0;font-size:14px}.food small{display:block;font-size:12px;color:#627477}.notes{font-size:12px;color:#627477}.actions{display:flex;gap:12px;margin-top:18px}.actions a,.actions button{border:1px solid #c7d7d4;border-radius:8px;padding:8px 12px;background:white;color:#146c6c;text-decoration:none}.empty{padding:30px}.button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #d3972e;outline-offset:3px}@media(max-width:850px){.layout{grid-template-columns:1fr}.aside{border-right:0;padding:14px}.triplist{display:flex;gap:10px;overflow:auto}.trip{min-width:210px;max-width:210px;margin:0}.media{height:330px}.detail{padding:20px}.columns{grid-template-columns:1fr}.panel{margin-bottom:12px}header{padding:20px 12px}.detail h2{font-size:26px}}@media print{aside,.media,.actions{display:none}.layout{display:block}.columns{display:block}.panel{margin-top:12px}header{background:white;color:#17324d}}
  </style>
</head>
<body>
  <header><h1>PLACES NEAR AUCKLAND THAT ARE NOT HAMILTON.</h1></header>
  <div class="layout">
    <aside>
      <input id="search" aria-label="Search trips" placeholder="Search places or food">
      <div class="filters">
        <button class="filter active" data-filter="All">All</button>
        <button class="filter" data-filter="Coast">Coast</button>
        <button class="filter" data-filter="Lake">Lakes</button>
        <button class="filter" data-filter="Walking">Walking</button>
        <button class="filter" data-filter="Town">Town</button>
      </div>
      <button id="reset" class="reset">Reset</button>
      <p id="count" aria-live="polite"></p>
      <div id="list" class="triplist"></div>
      <p class="notes">Drive times are estimates from the original guide. Check conditions and bookings.</p>
    </aside>
    <main>
      <div class="media">
        <div class="mapWrap">
          <iframe id="map" title="OpenStreetMap destination map" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
          <a id="maplink" class="maplink" target="_blank" rel="noopener">Open OpenStreetMap</a>
        </div>
        <figure class="photo">
          <img id="photo" alt="" hidden>
          <div id="fallback" class="fallback" hidden>Loading location photo...</div>
          <figcaption><a id="credit" target="_blank" rel="noopener">Location photo</a></figcaption>
        </figure>
      </div>
      <section id="detail" class="detail" aria-live="polite"></section>
    </main>
  </div>
  <script>
    const trips = [
      {name: 'Tāwharanui Regional Park', lat: -36.373, lng: 174.844, cat: ['coast'], drive: 'About 1½ hr', distance: '~90 km', stay: 'Auckland Council campground', effort: 'Low', tag: 'Closest coastal reset', query: 'Tawharanui Regional Park', intro: 'Beach, coastal walks and a Matakana lunch.', sights: ['Anchor Bay', 'Coastal walks', 'Matakana food stops'], watch: 'Book the campground. Check current park access and swimming advice.', url: 'https://www.aucklandcouncil.govt.nz/parks-recreation/stay-at-park/Pages/default.aspx', category: 'Coast', nights: '1–3 nights', foodnote: 'Brewery lunch, estuary-side brunch, then gelato.', wiki: 'Tāwharanui Regional Park', foods: [['Sawmill Brewery + Smoke Room', 'Craft beer and sharing plates. The long-lunch pick.', 'https://www.sawmillbrewery.co.nz/',''], ['The Farmers Daughter', 'Estuary-side brunch or lunch.', 'https://thefarmersdaughteromaha.co.nz/the-daughter/','']]},
      {name: 'Ōtāmure Bay, Whananaki', lat: -35.492, lng: 174.461, cat: ['coast'], drive: 'About 3½ hr', distance: '~225 km', stay: 'DOC campsite', effort: 'Low', tag: 'Northland beach camp', query: 'Otamure Bay Whananaki New Zealand', intro: 'A beach-first weekend. Arrive stocked and stay put.', sights: ['Beachfront camping', 'Coastal walks', 'An unhurried day at camp'], watch: 'Book ahead. Check gate hours and campsite rules.', url: 'https://www.doc.govt.nz/parks-and-recreation/places-to-go/northland/places/whananaki-area/things-to-do/otamure-bay-whananaki-campsite/', category: 'Coast', nights: '2 nights', foodnote: 'BYO everything. Easy camp dinners, breakfast and beach-day snacks.', wiki: 'Whananaki', foods: []},
      {name: 'Waitawau Bay', lat: -36.60586488, lng: 175.53701524, cat: ['coast'], drive: 'About 4½ hr', distance: '~265 km', stay: 'DOC campsite', effort: 'Low', tag: 'Remote Coromandel coast', query: 'Waitawau Bay Coromandel New Zealand', intro: 'A longer coastal stay where the campsite is the destination.', sights: ['Waitawau Bay beach', 'Bush walks', 'Time at camp'], watch: 'Book ahead and check the winding gravel-road approach. Carry all campsite meals.', url: 'https://www.doc.govt.nz/parks-and-recreation/places-to-go/coromandel/places/northern-coromandel/things-to-do/waitawau-bay-campsite/', category: 'Coast', nights: '3 nights', foodnote: 'One food pick.', wiki: 'Waitawau Bay', foods: [['Lukes Kitchen', 'Iconic woodfired pizza and laid-back coastal vibes. Kuaotunu is a separate outing.', 'https://www.lukeskitchen.co.nz/home-1','']]},
      {name: 'The Pinnacles', lat: -36.95, lng: 175.651, cat: ['walking'], drive: 'About 2½ hr', distance: '~145 km', stay: 'Pinnacles Hut or DOC valley camps', effort: 'Medium-high', tag: 'Best overnight tramp', query: 'Pinnacles Hut Kaueranga Valley New Zealand', intro: 'An overnight walk, not a drive-up stay.', sights: ['Kauaeranga Kauri Trails', 'Pinnacles Hut', 'Optional summit in suitable conditions'], watch: 'Book the hut. Check weather and track alerts. Drive to the road end, not the hut.', url: 'https://www.doc.govt.nz/parks-and-recreation/places-to-go/coromandel/places/coromandel-forest-park/kauaeranga-valley/', category: 'Walking', nights: '1 night', foodnote: 'BYO all meals and trail snacks.', wiki: 'The Pinnacles (Coromandel)', foods: []}
    ];

    const $ = id => document.getElementById(id), esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    let selected = 0, filter = 'All', photoToken = 0;
    const photoCache = new Map();

    function fitHeading(){
      const h = document.querySelector('h1');
      const header = h.parentElement;
      const style = getComputedStyle(header);
      const w = header.clientWidth - parseFloat(style.paddingLeft) - parseFloat(style.paddingRight);
      h.style.fontSize = '88px';
      let size = 88;
      while (h.scrollWidth > w && size > 24) {
        size -= 1;
        h.style.fontSize = size + 'px';
      }
      header.style.paddingTop = Math.max(20, size * .55) + 'px';
      header.style.paddingBottom = Math.max(20, size * .55) + 'px';
    }

    function matches(){
      const q = $('search').value.trim().toLowerCase();
      return trips.map((t, i) => ({t, i})).filter(({t}) => (filter === 'All' || t.category === filter) && (!q || JSON.stringify([t.name, t.foods, t.sights]).toLowerCase().includes(q)));
    }

    function renderList(){
      const v = matches();
      $('count').textContent = v.length + ' places';
      $('list').innerHTML = v.map(({t, i}) => `<button class="trip ${i === selected ? 'active' : ''}" data-trip="${i}" aria-pressed="${i === selected}"><strong>${esc(t.name)}</strong><small>${esc(t.drive)} • ${esc(t.nights)}</small></button>`).join('');
      document.querySelectorAll('[data-trip]').forEach(b => b.onclick = () => selectTrip(Number(b.dataset.trip)));
    }

    function setMap(t){
      const span = .065;
      const bbox = [t.lng - span, t.lat - span * .65, t.lng + span, t.lat + span * .65].join(',');
      $('map').src = 'https://www.openstreetmap.org/export/embed.html?bbox=' + encodeURIComponent(bbox) + '&layer=mapnik&marker=' + encodeURIComponent(t.lat + ',' + t.lng);
      $('maplink').href = 'https://www.openstreetmap.org/?mlat=' + t.lat + '&mlon=' + t.lng + '#map=12/' + t.lat + '/' + t.lng;
    }

    async function fetchDocImages(t){
      const q = encodeURIComponent(t.query || t.name);
      const docUrl = 'https://www.doc.govt.nz/search/?q=' + q;
      const res = await fetch(docUrl, { mode: 'cors' });
      if (!res.ok) return null;
      const html = await res.text();
      const matches = [...html.matchAll(/<img[^>]+src=["']([^"']+)["'][^>]*>/gi)];
      const src = matches.map(m => m[1]).find(url => /\.(png|jpe?g|webp|avif|gif)(\?.*)?$/i.test(url));
      return src || null;
    }

    async function fetchWikipediaImage(t){
      const title = encodeURIComponent(t.wiki || t.name);
      const url = 'https://en.wikipedia.org/w/api.php?origin=*' +
        '&action=query&format=json&prop=pageimages|info&inprop=url&piprop=thumbnail&pithumbsize=1200&redirects=1&titles=' + title;
      const res = await fetch(url, { mode: 'cors' });
      if (!res.ok) throw new Error('Wikipedia request failed');
      const data = await res.json();
      const page = Object.values(data.query.pages).find(p => p.thumbnail);
      if (!page || !page.thumbnail || !page.thumbnail.source) return null;
      return page.thumbnail.source;
    }

    async function locationPhoto(t){
      const token = ++photoToken;
      const img = $('photo');
      const fallback = $('fallback');
      const credit = $('credit');
      img.hidden = true;
      fallback.hidden = false;
      fallback.textContent = 'Loading location photo...';
      credit.textContent = 'Location photo';
      credit.href = '#';

      try {
        let data = photoCache.get(t.wiki || t.name);
        if (!data) {
          try {
            data = await fetchDocImages(t);
          } catch (e) {
            data = null;
          }
          if (!data) {
            try {
              data = await fetchWikipediaImage(t);
            } catch (e) {
              data = null;
            }
          }
          if (data) photoCache.set(t.wiki || t.name, data);
        }

        if (token !== photoToken) return;
        if (!data) {
          throw new Error('No photo found');
        }

        img.onload = () => {
          if (token !== photoToken) return;
          img.hidden = false;
          fallback.hidden = true;
        };
        img.onerror = () => {
          if (token !== photoToken) return;
          fallback.hidden = false;
          fallback.innerHTML = '<span>Photo unavailable here.<br><a target="_blank" rel="noopener" href="https://www.doc.govt.nz/">View location photos</a></span>';
        };
        img.src = data;
        credit.textContent = 'Photo source: DOC / Wikipedia';
        credit.href = 'https://www.doc.govt.nz/';
      } catch (e) {
        if (token !== photoToken) return;
        img.hidden = true;
        fallback.hidden = false;
        fallback.innerHTML = '<span>Photo unavailable here.<br><a target="_blank" rel="noopener" href="https://www.doc.govt.nz/">View location photos</a></span>';
      }
    }

    function selectTrip(i){
      selected = i;
      const t = trips[i];
      setMap(t);
      locationPhoto(t);
      $('detail').innerHTML = `<h2>${esc(t.name)}</h2><p class="intro">${esc(t.intro)}</p><div class="stats"><div class="stat"><small>Drive from Auckland</small>${esc(t.drive)}</div><div class="stat"><small>Suggested stay</small>${esc(t.nights)}</div></div><div class="columns"><div class="panel"><h3>Things to do</h3><ul>${t.sights.map(s => `<li>${esc(s)}</li>`).join('')}</ul></div><div class="panel"><h3>Stay</h3><p>${esc(t.stay)}</p><p>${esc(t.watch)}</p></div></div><div class="actions"><a href="${esc(t.url)}" target="_blank" rel="noopener">Official details</a><button id="print">Print trip</button></div>`;
      $('print').onclick = () => window.print();
      renderList();
    }

    function changed(){
      const v = matches();
      if (v.length) {
        selectTrip(v.some(x => x.i === selected) ? selected : v[0].i);
      } else {
        renderList();
        $('detail').innerHTML = '<div class="empty">No matches. Try another search or reset.</div>';
      }
    }

    $('search').oninput = changed;
    document.querySelectorAll('[data-filter]').forEach(b => b.onclick = () => {
      filter = b.dataset.filter;
      document.querySelectorAll('[data-filter]').forEach(x => x.classList.toggle('active', x === b));
      changed();
    });
    $('reset').onclick = () => {
      $('search').value = '';
      filter = 'All';
      document.querySelectorAll('[data-filter]').forEach(x => x.classList.toggle('active', x.dataset.filter === 'All'));
      changed();
    };

    window.addEventListener('resize', fitHeading);
    document.fonts?.ready.then(fitHeading);
    fitHeading();
    selectTrip(0);
  </script>
</body>
</html>
